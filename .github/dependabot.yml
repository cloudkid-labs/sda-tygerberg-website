# Weekly update PRs, each gated by the repo's PR checks, so a bump that breaks the build or a test does not merge.
# Minor and patch bumps arrive as one grouped PR per directory; every major gets its own PR to review alone.
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_READ_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    registries:
      - github-packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
