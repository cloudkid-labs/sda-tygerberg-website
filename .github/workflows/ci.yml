name: CI

# Nothing used to run on a pull request. Three workflows existed — two deploys
# and the version guard — and between them the first thing that ever compiled a
# branch was the deploy of it. A typo reached production before it reached a
# reviewer.
#
# Runs on every pull request, whatever the target branch, and on pushes to the
# two long-lived ones so a direct push is covered too.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Astro generates .astro/types.d.ts, which tsconfig includes. Without it
      # the typecheck fails on a clean checkout for a reason that has nothing to
      # do with the branch.
      - name: Generate Astro types
        run: npx astro sync

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The Worker splices live CMS content into built pages by re-rendering the
      # same React components (C-70). If its render of the build's own payload
      # differs from what Astro rendered, every homepage view would hydrate
      # against the wrong markup.
      - name: Check the Worker's CMS render matches the build
        run: node --import ./test/register.mjs scripts/check-cms-render.mjs

      # The build writes the Content-Security-Policy into dist/_headers from the
      # hashes of the inline scripts it just emitted. A build that quietly
      # shipped no policy would look identical from here.
      - name: Assert the CSP was written
        run: |
          grep -q "Content-Security-Policy:" dist/_headers \
            || { echo "::error::dist/_headers has no Content-Security-Policy"; exit 1; }
          grep -q "sha256-" dist/_headers \
            || { echo "::error::CSP carries no inline-script hashes"; exit 1; }

      # Every headshot the roster names must exist in both sizes, and every
      # fallback must be the size the generator would produce. Catches a photo
      # added without its fallback, which is invisible until transformations are
      # off and then breaks every card at once.
      #
      # `--check` writes nothing. Without it the script would generate the very
      # file that is missing and then report success.
      - name: Check the headshot fallbacks
        run: npm run headshots -- --check

  # The gate C-60 was missing.
  #
  # Every check that existed examined the artifact; none examined a running
  # deployment. So `run_worker_first` could take `/api/live-status` and
  # `/api/contact` out of service — the contact form answering with the 404 page
  # — while the typecheck, twenty-six tests, the build and `wrangler deploy` all
  # reported success. What eventually found it was `wrangler dev` on a laptop.
  #
  # This is that laptop step, automated. It runs the same `scripts/smoke.mjs`
  # the deploys run, against a Worker started from this commit, so a routing
  # regression fails the pull request instead of the release.
  #
  # It replaces the plan recorded until now, which was a Cloudflare WAF skip
  # rule letting the *production* smoke run gate. That is not coming — the zone
  # does not use the WAF, and the block is Cloudflare's default handling of
  # datacenter IPs. Running the checks locally sidesteps the edge entirely,
  # which is the better answer anyway: it fails before the deploy rather than
  # after it.
  worker:
    name: Worker smoke
    runs-on: ubuntu-latest
    # `wrangler dev` is a server: if it comes up but never answers, the wait
    # loop below is what ends the job, and this is the backstop under that.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # `wrangler dev` serves `dist/`, so the build has to happen first. Not
      # shared with the `check` job: passing dist between jobs costs an artifact
      # upload and download, which is slower than rebuilding this project.
      - name: Build
        run: npm run build

      # `--local` runs the Worker in workerd on this runner. No account, no API
      # token, no deploy — which is the point: the check cannot be blocked by
      # the edge, and it cannot touch production.
      #
      # Backgrounded with its log on disk, because the wait loop needs to be
      # able to print why it never came up.
      - name: Start the Worker
        run: |
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
        env:
          WRANGLER_SEND_METRICS: 'false'

      # Poll rather than sleep a fixed amount: it is ready in a couple of
      # seconds locally, and a fixed sleep is either wasted time or a flake.
      # Sixty seconds is the give-up point, and the log goes to the annotation
      # so a failure here says what happened.
      - name: Wait for the Worker
        run: |
          for i in $(seq 1 60); do
            # stderr silenced: curl writes a connection-refused line on every
            # attempt before it is up, which buries the real failure if there
            # is one.
            if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:8787/ 2>/dev/null; then
              echo "Worker answering after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler dev did not answer on 127.0.0.1:8787 within 60s"
          cat wrangler.log
          exit 1

      # The full set, no `--no-edge`: this target has the Worker *and* applies
      # `public/_headers`, so the API, the headshot guard and the security
      # headers are all in scope. This runs on every PR against a local Worker
      # that no edge can block, so it — not the post-deploy runs, which
      # Cloudflare answers 403 — is the real gate (C-60).
      #
      # `--expect-version` makes /health assert the build reports the version
      # it was built from (C-63). Instant here — the Worker serves this commit
      # — so no --wait-version; the default budget only matters if it fails.
      - name: Smoke-test the Worker
        timeout-minutes: 5
        run: npm run smoke -- http://127.0.0.1:8787 --expect-version "$(node -p 'require("./package.json").version')"

      # `always()`: a failed smoke run still has to release the port and let the
      # job finish rather than hold the runner to its timeout.
      - name: Stop the Worker
        if: always()
        run: |
          [ -f wrangler.pid ] && kill "$(cat wrangler.pid)" 2>/dev/null || true
          echo "--- wrangler log ---"
          cat wrangler.log 2>/dev/null || true
