name: Deploy devtest (Cloudflare)

# The integration preview, deployed from `dev`. A second Cloudflare Worker
# (`tygerberg-sda-website-devtest`, see `env.devtest` in wrangler.jsonc) on
# `tygerberg-sda.cloudkid.link` — the old production hostname, freed when
# production moved to sdatygerberg.co.za. It replaces the sunset GitHub Pages
# preview (C-61).
#
# Why a Worker and not Pages: Pages could not run `/api/*` or apply the
# security headers, so the C-60 class of routing bug could only ever surface in
# production. A devtest Worker is a faithful mirror — same `run_worker_first`,
# same edge — so the post-deploy smoke here exercises the real thing.
#
# Uses the same two secrets as production:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit + the tygerberg-sda.cloudkid.link zone)
#   CLOUDFLARE_ACCOUNT_ID
# and deliberately NO YouTube secrets — the devtest Worker runs keyless
# (see wrangler.jsonc env.devtest for why).
#
# Members-area sign-in on the preview (C-70) uploads three Worker secrets:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  the production OAuth client, whose
#                                           redirect URIs include devtest's
#   SESSION_SECRET  <- DEVTEST_SESSION_SECRET  the preview's own signing key,
#                                           created by terraform/, so a preview
#                                           session never verifies on production
# All three repo secrets must exist before a run carrying this block: a
# listed-but-unset name uploads an empty value (sign-in then answers
# not-configured, as before).
on:
  push:
    branches: [dev]
    paths-ignore:
      - 'sda-struisbaai-website/**'
      - '.github/workflows/deploy-struisbaai-devtest.yml'
      - '.github/workflows/deploy-devtest-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtest-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # No `environment:` key — see deploy-production-cloudflare.yml. Environment
    # secrets do not resolve on a private Free-plan repo; the Cloudflare secrets
    # are repository secrets, and this job reads them directly (C-61).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Restores ~/.npm keyed on package-lock.json. See the production
          # workflow for why node_modules itself is not cached on top.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (root base path)
        run: npm run build
        env:
          # The only build flag that differs from production: the preview is
          # kept out of search results. Its canonical still points at
          # production (C-23), so the two never compete. PUBLIC_HAS_API and
          # PUBLIC_IMAGE_CDN are left at their defaults (enabled) now that a
          # Worker and the Cloudflare edge are in front of devtest, unlike the
          # old Pages preview.
          PUBLIC_INDEXABLE: 'false'
          # Stamped so `curl -s <devtest>/ | grep app-commit` says which commit
          # the preview is serving. No version tag — devtest is never a release.
          PUBLIC_APP_COMMIT: ${{ github.sha }}
          # Same public key as production; harmless here — devtest carries no
          # TURNSTILE_SECRET_KEY, so the Worker skips verification and the form
          # answers `not-configured` as before. C-21.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --env devtest selects the named environment in wrangler.jsonc:
          # a distinct Worker on tygerberg-sda.cloudkid.link with no email or
          # consent bindings.
          command: deploy --env devtest
          # Required as well as the --env above: the action uploads `secrets:`
          # with `wrangler secret bulk`, adding --env only from this input, never
          # from `command`. Without it the secrets land on the top-level Worker,
          # which is production (C-70; pinned by test/wranglerConfig.test.mjs).
          environment: devtest
          # Names only; the action runs `wrangler secret put` for each, reading
          # the value from this step's env. See the header for why the session
          # key is the preview's own.
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            SESSION_SECRET
        env:
          # Step-scoped, so none of these is present during the build above.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.DEVTEST_SESSION_SECRET }}

      # Same script as production, and now with the edge checks it could never
      # run against Pages: /api/* routing, the security headers, and the
      # headshot master guard. It may still come back inconclusive — Cloudflare
      # answers this runner 403 on the devtest zone exactly as it does on
      # production — but a mixed result is a real failure and the script exits 1
      # on it. The gating check remains the `worker` job in ci.yml (C-60).
      #
      # `--expect-version` polls /health for up to 3 minutes for the version
      # this deploy built (C-63) — the post-deploy indicator that the preview
      # is serving the new commit, not the previous one. The poll skips itself
      # with a note when the edge blocks this runner rather than burning the
      # budget, so a blocked run stays inconclusive instead of red.
      #
      # `--expect-transform` probes a homepage /cdn-cgi/image/ URL: this build
      # leaves transforms on and the cloudkid.link zone supports them, so one
      # must answer as an image (C-61). Production passes it too since
      # 2026-09-08 — its zone has Resizing and its build serves transforms.
      - name: Smoke-test the preview
        timeout-minutes: 8
        # --expect-noindex: this build is the preview, so the check fails if the
        # noindex meta is missing (a preview that would compete with production,
        # C-23/C-61). The canonical-host check runs regardless.
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: npm run smoke -- https://tygerberg-sda.cloudkid.link --expect-noindex --expect-version "$(node -p 'require("./package.json").version')" --wait-version 180 --expect-transform
