name: Deploy devtest (GitHub Pages)

# Free, no-secrets-required preview build. Static only — the /api/* routes
# from src/worker/ aren't available here (that needs the Cloudflare Worker,
# see deploy-production-cloudflare.yml).
#
# Triggers off `dev`, the integration branch — feature PRs merge here first
# for preview, then a dev -> main PR gates promotion to production (see
# README "Branch strategy").
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Restores ~/.npm keyed on package-lock.json. See the production
          # workflow for why node_modules itself is not cached on top.
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (base path = /${{ github.event.repository.name }}/)
        run: npm run build
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}/
          # No Worker on Pages, so /api/live-status doesn't exist here. Skip
          # the poll rather than 404 on a loop; the LIVE badge simply never
          # shows on devtest.
          PUBLIC_HAS_API: 'false'
          # This preview is served from a public github.io URL, and robots.txt
          # can't reach it — that file is only honoured at a domain root, and
          # the root here belongs to github.io. A noindex meta is the only way
          # to keep the preview out of search results and stop it competing
          # with production. Unset elsewhere, so production indexes normally.
          PUBLIC_INDEXABLE: 'false'
          # No Cloudflare in front of Pages, so /cdn-cgi/image/* is a plain
          # 404 here. This makes the cards render the pre-resized fallback
          # copies from the first paint, rather than each one discovering the
          # missing transformer by 404ing on its own.
          PUBLIC_IMAGE_CDN: 'false'

      # Nothing in the devtest build references them: PUBLIC_IMAGE_CDN=false
      # sends every card to `fallback/`, so the masters are 104 MB of artifact
      # that is uploaded, stored and served to nobody. The fallback directory is
      # a level down and is not touched by this glob. C-51
      - name: Drop the headshot masters from the preview artifact
        run: rm -f dist/images/hod/*.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Same check as production, against whatever URL Pages just published.
      # `--no-api`: there is no Worker here, so /api/* is absent by design
      # (PUBLIC_HAS_API=false above) and its absence is not a failure. That
      # means this run cannot catch the C-60 routing bug — only the production
      # smoke test can — but it does catch a broken page or a missing asset
      # before the promotion PR is opened.
      - name: Smoke-test the preview
        timeout-minutes: 5
        run: npm run smoke -- "${{ steps.deployment.outputs.page_url }}" --no-edge
