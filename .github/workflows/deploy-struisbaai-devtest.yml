name: Deploy SDA Struisbaai devtest (Cloudflare)

on:
  push:
    branches: [dev]
    paths:
      - 'sda-struisbaai-website/**'
      - '.github/workflows/deploy-struisbaai-devtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: struisbaai-devtest-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'sda-struisbaai-website/.nvmrc'
          cache: npm
          cache-dependency-path: sda-struisbaai-website/package-lock.json

      - name: Install dependencies
        working-directory: sda-struisbaai-website
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build devtest
        working-directory: sda-struisbaai-website
        run: npm run build
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_APP_COMMIT: ${{ github.sha }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy devtest Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sda-struisbaai-website
          command: deploy --env devtest
          environment: devtest

      - name: Smoke-test devtest
        working-directory: sda-struisbaai-website
        timeout-minutes: 8
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: npm run smoke -- https://struisbaai-sda.cloudkid.link --expect-noindex --expect-canonical-host struisbaai-sda.cloudkid.link --expect-version "$(node -p 'require("./package.json").version')" --wait-version 180 --expect-transform
